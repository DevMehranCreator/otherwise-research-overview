<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Otherwise — a machine that earns its beliefs</title>
<desc id="desc">A minimal dark scientific scene with a planet and orbital paths.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111e"/><stop offset="1" stop-color="#101f33"/></linearGradient>
  <radialGradient id="planet"><stop offset="0" stop-color="#e4f3ff"/><stop offset=".48" stop-color="#82b8d7"/><stop offset="1" stop-color="#24475f"/></radialGradient>
  <linearGradient id="accent"><stop offset="0" stop-color="#6ee7f9"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient>
</defs>
<rect width="1200" height="420" rx="26" fill="url(#bg)"/>
<g fill="none" stroke="url(#accent)" stroke-width="1.5" opacity=".38">
  <ellipse cx="930" cy="206" rx="208" ry="72" transform="rotate(-28 930 206)"/>
  <ellipse cx="930" cy="206" rx="208" ry="112" transform="rotate(34 930 206)"/>
  <ellipse cx="930" cy="206" rx="153" ry="112" transform="rotate(88 930 206)"/>
</g>
<circle cx="930" cy="206" r="66" fill="url(#planet)"/>
<circle cx="930" cy="206" r="76" fill="none" stroke="#8be3fa" stroke-width="1" opacity=".28"/>
<g fill="#d9f6ff">
  <circle cx="811" cy="257" r="4"/><circle cx="1082" cy="122" r="3"/><circle cx="1017" cy="324" r="3"/>
  <circle cx="868" cy="108" r="2"/><circle cx="1120" cy="266" r="2"/><circle cx="790" cy="151" r="2"/>
</g>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="80" y="98" font-size="17" letter-spacing="5" fill="#83dff2">INDEPENDENT RESEARCH PROTOTYPE</text>
  <text x="76" y="190" font-size="76" font-weight="700" letter-spacing="-2" fill="#f4f8ff">OTHERWISE</text>
  <rect x="80" y="220" width="76" height="4" rx="2" fill="url(#accent)"/>
  <text x="80" y="269" font-size="27" fill="#d5e6f4">A machine that earns its beliefs.</text>
  <text x="80" y="316" font-size="18" fill="#9fb6ca">Observe · hypothesize · predict · test · revise</text>
